[project]
name = "tp-sda"
version = "0.1.0"
description = "TP Integrador Entrega 1 - Pipeline de postventa de Portalia"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.12",
    "google-genai>=1.0",
    "langchain-community<0.4",
    "langchain-core==1.6.9",
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.0",
    "pydantic>=2.11",
    "python-dotenv>=1.0",
    "ragas>=0.4.3",
    "tiktoken>=0.9",
]

[tool.uv]
# Repo de scripts: uv gestiona las dependencias, no construye ni instala el proyecto.
package = false
